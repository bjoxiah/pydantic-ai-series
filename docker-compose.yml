services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: agent-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db            # creates app_db on first boot
                                     # Temporal creates temporal_db + temporal_visibility itself
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── RedisInsight ──────────────────────────────────────────────────────────
  redis-ui:
    image: redis/redisinsight:latest
    container_name: agent-redis-ui
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data

  # ── pgAdmin — Postgres UI ─────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: agent-pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"     # http://localhost:5050
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # ── Temporal server ───────────────────────────────────────────────────────
  temporal:
    image: temporalio/auto-setup:1.24
    container_name: agent-temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_SEEDS=postgres
      - DBNAME=temporal_db
      - VISIBILITY_DBNAME=temporal_visibility
      # No DYNAMIC_CONFIG_FILE_PATH — Temporal uses built-in defaults for local dev
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ── Temporal UI ───────────────────────────────────────────────────────────
  temporal-ui:
    image: temporalio/ui:latest
    container_name: agent-temporal-ui
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

  # ── FastAPI API ───────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: api/Dockerfile
    container_name: agent-api
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # These override .env values — use Docker service names not localhost
      TEMPORAL_URL: temporal:7233
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app_db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app          # source code — hot reload
      - api_venv:/app/.venv     # venv as named volume — survives source mount
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ── Temporal Worker ───────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: worker/Dockerfile
    container_name: agent-worker
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      TEMPORAL_URL: temporal:7233
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app_db
    volumes:
      - ./backend:/app
      - worker_venv:/app/.venv

  # ── Next.js frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agent-frontend
    depends_on:
      - api
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  redis_data:
  redisinsight_data:
  pgadmin_data:
  api_venv:
  worker_venv: