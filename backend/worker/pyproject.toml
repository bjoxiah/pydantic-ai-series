[project]
name = "forge-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "forge-shared",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.uv.sources]
forge-shared = { workspace = true }
