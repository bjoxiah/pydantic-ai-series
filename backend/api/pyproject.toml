[project]
name = "forge-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "forge-shared",
    "fastapi>=0.137.0",
    "uvicorn[standard]>=0.49.0",
    "PyJWT[crypto]>=2.8.0",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.uv.sources]
forge-shared = { workspace = true }
