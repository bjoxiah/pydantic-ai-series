[project]
name = "forge-shared"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "certifi>=2024.0.0",
    "cryptography>=44.0.0",
    "e2b>=2.28.2",
    "greenlet>=3.5.3",
    "httpx>=0.28.0",
    "logfire[fastapi]>=3.0.0",
    "pydantic-ai>=1.107.0",
    "pydantic-ai-skills>=0.11.0",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "redis>=8.0.0",
    "sqlalchemy>=2.0.51",
    "sqlmodel>=0.0.39",
    "temporalio>=1.9.0",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "db*", "template*"]

[tool.setuptools]
py-modules = ["settings", "redis_client", "crypto"]
